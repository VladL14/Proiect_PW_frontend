<section class="auth-card" aria-label="Authentication">
  <header class="auth-tabs">
    <button type="button" [class.active]="mode === 'login'" (click)="switchMode('login')">Sign in</button>
    <button type="button" [class.active]="mode === 'register'" (click)="switchMode('register')">Create account</button>
    <button type="button" class="auth-close" (click)="closed.emit()" aria-label="Close">×</button>
  </header>

  <form class="auth-form" (ngSubmit)="submit()" #authForm="ngForm">
    <label>
      <span>{{ mode === 'login' ? 'Username or email' : 'Username' }}</span>
      <input type="text" name="username" [(ngModel)]="username" required minlength="3" autocomplete="username" />
    </label>

    <label *ngIf="mode === 'register'">
      <span>Email</span>
      <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
    </label>

    <label *ngIf="mode === 'register'">
      <span>Display name (optional)</span>
      <input type="text" name="displayName" [(ngModel)]="displayName" autocomplete="nickname" />
    </label>

    <label>
      <span>Password</span>
      <input type="password" name="password" [(ngModel)]="password" required minlength="6" autocomplete="current-password" />
    </label>

    <p class="auth-error" *ngIf="error">{{ error }}</p>

    <button type="submit" class="auth-submit" [disabled]="authForm.invalid || loading">
      {{ loading ? 'Please wait…' : (mode === 'login' ? 'Sign in' : 'Register') }}
    </button>

    <p class="auth-hint" *ngIf="mode === 'login'">Default admin: <code>admin / admin123</code></p>
  </form>
</section>
