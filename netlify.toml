# Netlify build configuration for the Angular frontend.

[build]
  command = "npm ci && npm run build -- --output-mode=static"
  publish = "dist/dice-duel-frontend/browser"

[[redirects]]
  from   = "/api/*"
  to     = "https://dice-duel-api.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
